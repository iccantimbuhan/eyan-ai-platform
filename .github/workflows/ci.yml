name: Continuous Integration

on:
  push:
    branches:
      - main
      - dev
      - sprint-**
  pull_request:
    branches:
      - main
      - dev

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @eyan/backend exec prisma generate

      - name: Type check backend
        run: pnpm --filter @eyan/backend typecheck

      - name: Build backend
        run: pnpm --filter @eyan/backend build

      - name: Build frontend
        run: pnpm --filter @eyan/frontend build
